name: Release as-is build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        env:
          MACLUM_VERSION: ${{ github.ref_name }}
          MACLUM_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh
      - name: Verify bundle
        run: ./scripts/verify-app-bundle.sh
      - name: Create archive and checksum
        run: ./scripts/package-release.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .build/release/Maclum-macos-apple-silicon.zip \
            .build/release/Maclum-macos-apple-silicon.zip.sha256 \
            --generate-notes \
            --title "Maclum $GITHUB_REF_NAME"
